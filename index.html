<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --glow: rgba(79, 70, 229, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    h1, h2 {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, textarea, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--glow);
    }

    /* Fix Calendar Icon for Dark Theme */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.7;
      cursor: pointer;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--primary);
      width: auto;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-text:hover {
      background: transparent;
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header-bar button {
      width: auto;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .input-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    /* Status Filters */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 4px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.85rem;
      cursor: pointer;
      width: auto;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pill .badge-count {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* Task Item Cards */
    .task-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .task-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .task-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .task-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 8px;
      white-space: pre-line;
      word-break: break-word;
      background: rgba(0,0,0,0.15);
      padding: 10px;
      border-radius: 8px;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-actions select {
      width: auto;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-del {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      width: auto;
      border-radius: 8px;
    }

    .btn-del:hover {
      background: var(--danger);
      color: #fff;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 6px;
      margin-right: 6px;
    }

    .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-in_progress { background: rgba(79, 70, 229, 0.15); color: #818cf8; border: 1px solid rgba(79, 70, 229, 0.3); }
    .badge-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    
    .badge-date { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); }
    .badge-overdue { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body>

<div class="container">
  <!-- AUTHENTICATION CARD -->
  <div id="auth-section" class="card">
    <h2 id="auth-title" style="margin-bottom: 8px;">Sign In</h2>
    <p class="muted" style="margin-bottom: 24px;">Enter your credentials to manage your tasks.</p>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="auth-email" placeholder="name@example.com" autocomplete="off" required />
    </div>

    <div class="form-group" id="pin-group">
      <label>6-Digit PIN</label>
      <input type="password" id="auth-pin" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="••••••" autocomplete="new-password" />
    </div>

    <button id="auth-submit-btn" style="margin-top: 8px;">Sign In</button>
    <button id="forgot-btn" class="btn-secondary" style="margin-top: 10px;">Forgot PIN?</button>

    <div style="text-align: center; margin-top: 18px; font-size: 0.88rem;">
      <span id="toggle-text" class="muted">Don't have an account?</span>
      <a id="toggle-link" style="color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: none; margin-left: 4px;">Sign Up</a>
    </div>
  </div>

  <!-- DASHBOARD CARD -->
  <div id="app-section" class="hidden">
    <div class="card">
      <div class="header-bar">
        <div>
          <h2>Daily Tasks</h2>
          <p id="user-display" class="muted" style="margin-top: 2px;"></p>
        </div>
        <button id="logout-btn" class="btn-secondary">Sign Out</button>
      </div>

      <!-- Task Creator -->
      <div class="input-card">
        <input type="text" id="task-title-input" placeholder="What needs to be done?" style="margin-bottom: 8px;" />
        
        <div id="desc-container" class="hidden" style="margin-bottom: 10px;">
          <textarea id="task-desc-input" placeholder="Add additional details or notes (optional)..."></textarea>
        </div>

        <div id="date-container" class="hidden" style="margin-bottom: 10px;">
          <label style="margin-bottom: 4px;">Target Due Date:</label>
          <input type="date" id="task-date-input" />
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;">
          <div style="display: flex; gap: 8px;">
            <button type="button" id="toggle-desc-btn" class="btn-text">+ Add Description</button>
            <button type="button" id="toggle-date-btn" class="btn-text">+ Add Due Date</button>
          </div>
          <button id="add-task-btn" style="width: auto; padding: 10px 24px;">Save Task</button>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <button class="pill active" data-filter="all">All <span class="badge-count" id="count-all">0</span></button>
        <button class="pill" data-filter="pending">Pending <span class="badge-count" id="count-pending">0</span></button>
        <button class="pill" data-filter="in_progress">In Progress <span class="badge-count" id="count-progress">0</span></button>
        <button class="pill" data-filter="completed">Completed <span class="badge-count" id="count-completed">0</span></button>
      </div>

      <!-- Task List Container -->
      <div id="task-list"></div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    sendPasswordResetEmail, 
    onAuthStateChanged, 
    signOut,
    setPersistence,
    inMemoryPersistence
  } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    query, 
    onSnapshot, 
    doc, 
    updateDoc, 
    deleteDoc 
  } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCi-DX9mdfScUpXbHQxMN6N_6_x0ql6NqU",
    authDomain: "task---manager.firebaseapp.com",
    projectId: "task---manager",
    storageBucket: "task---manager.firebasestorage.app",
    messagingSenderId: "956237389035",
    appId: "1:956237389035:web:1856a751fa793ba29532ae"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Destroy session on page refresh
  setPersistence(auth, inMemoryPersistence).catch((error) => console.error(error));

  let currentUser = null;
  let unsubscribeTasks = null;
  let currentFilter = "all";
  let authMode = "login";

  // Helpers for Dates
  const getLocalDateString = () => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  };

  const formatDateTime = (timestamp) => {
    if (!timestamp) return "N/A";
    return new Date(timestamp).toLocaleDateString("en-IN", {
      day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: true
    });
  };

  const formatDateOnly = (dateString) => {
    if (!dateString) return "";
    return new Date(dateString).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  };

  // UI Elements
  const authSection = document.getElementById("auth-section");
  const appSection = document.getElementById("app-section");
  const authTitle = document.getElementById("auth-title");
  const authEmail = document.getElementById("auth-email");
  const authPin = document.getElementById("auth-pin");
  const authSubmitBtn = document.getElementById("auth-submit-btn");
  const forgotBtn = document.getElementById("forgot-btn");
  const toggleLink = document.getElementById("toggle-link");
  const toggleText = document.getElementById("toggle-text");
  const pinGroup = document.getElementById("pin-group");
  const userDisplay = document.getElementById("user-display");
  
  const taskTitleInput = document.getElementById("task-title-input");
  const taskDescInput = document.getElementById("task-desc-input");
  const taskDateInput = document.getElementById("task-date-input");
  
  const toggleDescBtn = document.getElementById("toggle-desc-btn");
  const toggleDateBtn = document.getElementById("toggle-date-btn");
  const descContainer = document.getElementById("desc-container");
  const dateContainer = document.getElementById("date-container");
  
  const addTaskBtn = document.getElementById("add-task-btn");
  const taskList = document.getElementById("task-list");
  const logoutBtn = document.getElementById("logout-btn");

  // Input Toggles
  toggleDescBtn.addEventListener("click", () => {
    if (descContainer.classList.contains("hidden")) {
      descContainer.classList.remove("hidden");
      toggleDescBtn.innerText = "- Remove Description";
      taskDescInput.focus();
    } else {
      descContainer.classList.add("hidden");
      toggleDescBtn.innerText = "+ Add Description";
      taskDescInput.value = "";
    }
  });

  toggleDateBtn.addEventListener("click", () => {
    if (dateContainer.classList.contains("hidden")) {
      dateContainer.classList.remove("hidden");
      toggleDateBtn.innerText = "- Remove Due Date";
      taskDateInput.value = getLocalDateString();
    } else {
      dateContainer.classList.add("hidden");
      toggleDateBtn.innerText = "+ Add Due Date";
      taskDateInput.value = "";
    }
  });

  // Auth State
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      userDisplay.innerText = user.email;
      authSection.classList.add("hidden");
      appSection.classList.remove("hidden");
      loadTasks();
    } else {
      currentUser = null;
      if (unsubscribeTasks) unsubscribeTasks();
      authSection.classList.remove("hidden");
      appSection.classList.add("hidden");
    }
  });

  // Auth Modes
  toggleLink.addEventListener("click", () => {
    if (authMode === "login") {
      authMode = "signup";
      authTitle.innerText = "Create Account";
      authSubmitBtn.innerText = "Register";
      toggleText.innerText = "Already have an account?";
      toggleLink.innerText = "Sign In";
      forgotBtn.classList.add("hidden");
      pinGroup.classList.remove("hidden");
    } else {
      authMode = "login";
      authTitle.innerText = "Sign In";
      authSubmitBtn.innerText = "Sign In";
      toggleText.innerText = "Don't have an account?";
      toggleLink.innerText = "Sign Up";
      forgotBtn.classList.remove("hidden");
      pinGroup.classList.remove("hidden");
    }
  });

  forgotBtn.addEventListener("click", () => {
    authMode = "forgot";
    authTitle.innerText = "Reset PIN";
    authSubmitBtn.innerText = "Send Reset Link";
    pinGroup.classList.add("hidden");
    forgotBtn.classList.add("hidden");
    toggleText.innerText = "Remembered credentials?";
    toggleLink.innerText = "Sign In";
  });

  // Auth Submit
  authSubmitBtn.addEventListener("click", async () => {
    const email = authEmail.value.trim();
    const pin = authPin.value.trim();
    if (!email) return alert("Please enter your email.");
    try {
      if (authMode === "signup") {
        if (pin.length !== 6 || isNaN(pin)) return alert("PIN must be exactly 6 numeric digits.");
        await createUserWithEmailAndPassword(auth, email, pin);
      } else if (authMode === "login") {
        if (pin.length !== 6) return alert("PIN must be exactly 6 numeric digits.");
        await signInWithEmailAndPassword(auth, email, pin);
      } else if (authMode === "forgot") {
        await sendPasswordResetEmail(auth, email);
        alert("Reset instructions sent to your email.");
        authMode = "login";
        authTitle.innerText = "Sign In";
        authSubmitBtn.innerText = "Sign In";
        pinGroup.classList.remove("hidden");
        forgotBtn.classList.remove("hidden");
      }
    } catch (err) {
      alert(err.message);
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    authEmail.value = "";
    authPin.value = "";
  });

  // Filters
  document.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      loadTasks();
    });
  });

  // Add Task
  addTaskBtn.addEventListener("click", async () => {
    const title = taskTitleInput.value.trim();
    const desc = taskDescInput.value.trim();
    const dueDate = !dateContainer.classList.contains("hidden") ? taskDateInput.value : null;
    
    if (!title || !currentUser) return alert("Task title cannot be empty.");

    try {
      const now = Date.now();
      await addDoc(collection(db, `users/${currentUser.uid}/tasks`), {
        title: title,
        description: desc || "",
        dueDate: dueDate,
        status: "pending",
        createdAt: now,
        modifiedAt: now
      });

      // Reset Form
      taskTitleInput.value = "";
      taskDescInput.value = "";
      taskDateInput.value = "";
      if (!descContainer.classList.contains("hidden")) {
        descContainer.classList.add("hidden");
        toggleDescBtn.innerText = "+ Add Description";
      }
      if (!dateContainer.classList.contains("hidden")) {
        dateContainer.classList.add("hidden");
        toggleDateBtn.innerText = "+ Add Due Date";
      }
    } catch (err) {
      alert("Error adding task: " + err.message);
    }
  });

  // Render Tasks
  function loadTasks() {
    if (!currentUser) return;
    if (unsubscribeTasks) unsubscribeTasks();

    const taskCol = collection(db, `users/${currentUser.uid}/tasks`);
    const q = query(taskCol); // Fetch all tasks regardless of date

    unsubscribeTasks = onSnapshot(q, (snapshot) => {
      let rawTasks = [];
      snapshot.forEach(docSnap => rawTasks.push({ id: docSnap.id, ...docSnap.data() }));

      // Update Counts
      document.getElementById("count-all").innerText = rawTasks.length;
      document.getElementById("count-pending").innerText = rawTasks.filter(t => t.status === "pending").length;
      document.getElementById("count-progress").innerText = rawTasks.filter(t => t.status === "in_progress").length;
      document.getElementById("count-completed").innerText = rawTasks.filter(t => t.status === "completed").length;

      // Filter and Sort Newest First
      let filteredTasks = currentFilter === "all" ? rawTasks : rawTasks.filter(t => t.status === currentFilter);
      filteredTasks.sort((a, b) => (b.modifiedAt || b.createdAt || 0) - (a.modifiedAt || a.createdAt || 0));

      taskList.innerHTML = "";

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `<p class="muted" style="text-align: center; padding: 24px;">No tasks found.</p>`;
        return;
      }

      const todayStr = getLocalDateString();

      filteredTasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task-card";

        const statusLabel = task.status === "completed" ? "Completed" : (task.status === "in_progress" ? "In Progress" : "Pending");
        
        let dateBadge = "";
        if (task.dueDate) {
          const isOverdue = (task.dueDate < todayStr) && task.status !== "completed";
          const dateBadgeClass = isOverdue ? "badge-overdue" : "badge-date";
          dateBadge = `<span class="badge ${dateBadgeClass}">📅 Due: ${formatDateOnly(task.dueDate)}</span>`;
        }

        item.innerHTML = `
          <div class="task-head">
            <div style="flex: 1;">
              <div>
                <span class="badge badge-${task.status}">${statusLabel}</span>
                ${dateBadge}
              </div>
              <div class="task-title ${task.status === 'completed' ? 'completed' : ''}">${escapeHtml(task.title)}</div>
              ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
            </div>
            <div class="task-actions">
              <select class="status-select" data-id="${task.id}">
                <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Completed</option>
              </select>
              <button class="btn-del" data-id="${task.id}" title="Delete Task">✕</button>
            </div>
          </div>
          <div class="task-meta">
            <span><strong>Created:</strong> ${formatDateTime(task.createdAt)}</span>
            <span><strong>Modified:</strong> ${formatDateTime(task.modifiedAt)}</span>
          </div>
        `;
        taskList.appendChild(item);
      });

      // Listeners
      document.querySelectorAll(".status-select").forEach(sel => {
        sel.addEventListener("change", async (e) => {
          await updateDoc(doc(db, `users/${currentUser.uid}/tasks`, e.target.dataset.id), { 
            status: e.target.value, modifiedAt: Date.now() 
          });
        });
      });

      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          if (confirm("Are you sure you want to delete this task?")) {
            await deleteDoc(doc(db, `users/${currentUser.uid}/tasks`, e.target.dataset.id));
          }
        });
      });
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
