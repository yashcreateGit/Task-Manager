<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 680px; }
    .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
    h1, h2 { font-size: 1.5rem; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); margin-top: 8px; }
    .btn-danger { background: var(--danger); }
    .auth-toggle { text-align: center; margin-top: 12px; font-size: 0.85rem; }
    .auth-toggle a { color: var(--primary); text-decoration: none; cursor: pointer; font-weight: 600; }
    .hidden { display: none !important; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header button { width: auto; padding: 6px 12px; font-size: 0.85rem; }
    
    /* Calendar & Date Selection */
    .date-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    .date-bar input[type="date"] { flex: 1; }
    
    /* Filters */
    .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .pill { padding: 6px 14px; border-radius: 20px; background: #e2e8f0; border: none; font-size: 0.85rem; cursor: pointer; width: auto; color: var(--text); }
    .pill.active { background: var(--primary); color: white; }
    
    /* Task List */
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; background: var(--card); }
    .task-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .task-title { font-size: 1rem; }
    .task-title.completed { text-decoration: line-through; color: var(--muted); }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: var(--warning); }
    .badge-progress { background: #dbeafe; color: var(--primary); }
    .badge-completed { background: #dcfce7; color: var(--success); }
    .actions { display: flex; gap: 6px; }
    .actions button { width: auto; padding: 6px 10px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <!-- AUTHENTICATION CARD -->
  <div id="auth-section" class="card">
    <h2 id="auth-title">Sign In</h2>
    <p class="muted" style="margin-bottom: 16px;">Use your Email and 6-digit PIN to access your workspace.</p>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="auth-email" placeholder="name@example.com" required />
    </div>

    <div class="form-group" id="pin-group">
      <label>6-Digit PIN</label>
      <input type="password" id="auth-pin" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="••••••" />
    </div>

    <button id="auth-submit-btn">Sign In</button>
    <button id="forgot-btn" class="btn-secondary">Forgot PIN?</button>

    <div class="auth-toggle">
      <span id="toggle-text">Don't have an account?</span> 
      <a id="toggle-link">Sign Up</a>
    </div>
  </div>

  <!-- MAIN TASK MANAGER DASHBOARD -->
  <div id="app-section" class="hidden">
    <div class="card">
      <div class="header">
        <div>
          <h2>Daily Workspace</h2>
          <p id="user-display" class="muted"></p>
        </div>
        <button id="logout-btn" class="btn-secondary">Sign Out</button>
      </div>

      <!-- Date Selection -->
      <div class="date-bar">
        <label style="margin: 0; min-width: 90px;">Select Date:</label>
        <input type="date" id="selected-date" />
      </div>

      <!-- Task Input -->
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="task-input" placeholder="Add a new task for this day..." />
        <button id="add-task-btn" style="width: 100px;">Add</button>
      </div>

      <!-- Status Filters -->
      <div class="filter-pills">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="pending">Pending</button>
        <button class="pill" data-filter="in_progress">In Progress</button>
        <button class="pill" data-filter="completed">Completed</button>
      </div>

      <!-- Task Container -->
      <div id="task-list"></div>
    </div>
  </div>
</div>

<!-- Firebase SDKs (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    sendPasswordResetEmail, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    query, 
    where, 
    onSnapshot, 
    doc, 
    updateDoc, 
    deleteDoc 
  } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCi-DX9mdfScUpXbHQxMN6N_6_x0ql6NqU",
    authDomain: "task---manager.firebaseapp.com",
    projectId: "task---manager",
    storageBucket: "task---manager.firebasestorage.app",
    messagingSenderId: "956237389035",
    appId: "1:956237389035:web:1856a751fa793ba29532ae"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let unsubscribeTasks = null;
  let currentFilter = "all";
  let authMode = "login"; // 'login', 'signup', 'forgot'

  // Set today's date in local time
  const today = new Date().toISOString().split("T")[0];
  const dateInput = document.getElementById("selected-date");
  dateInput.value = today;

  // UI Element References
  const authSection = document.getElementById("auth-section");
  const appSection = document.getElementById("app-section");
  const authTitle = document.getElementById("auth-title");
  const authEmail = document.getElementById("auth-email");
  const authPin = document.getElementById("auth-pin");
  const authSubmitBtn = document.getElementById("auth-submit-btn");
  const forgotBtn = document.getElementById("forgot-btn");
  const toggleLink = document.getElementById("toggle-link");
  const toggleText = document.getElementById("toggle-text");
  const pinGroup = document.getElementById("pin-group");
  const userDisplay = document.getElementById("user-display");
  const taskInput = document.getElementById("task-input");
  const addTaskBtn = document.getElementById("add-task-btn");
  const taskList = document.getElementById("task-list");
  const logoutBtn = document.getElementById("logout-btn");

  // Auth State Listener
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      userDisplay.innerText = user.email;
      authSection.classList.add("hidden");
      appSection.classList.remove("hidden");
      loadTasks();
    } else {
      currentUser = null;
      if (unsubscribeTasks) unsubscribeTasks();
      authSection.classList.remove("hidden");
      appSection.classList.add("hidden");
    }
  });

  // Toggle Auth Modes
  toggleLink.addEventListener("click", () => {
    if (authMode === "login") {
      authMode = "signup";
      authTitle.innerText = "Create Account";
      authSubmitBtn.innerText = "Register";
      toggleText.innerText = "Already have an account?";
      toggleLink.innerText = "Sign In";
      forgotBtn.classList.add("hidden");
      pinGroup.classList.remove("hidden");
    } else {
      authMode = "login";
      authTitle.innerText = "Sign In";
      authSubmitBtn.innerText = "Sign In";
      toggleText.innerText = "Don't have an account?";
      toggleLink.innerText = "Sign Up";
      forgotBtn.classList.remove("hidden");
      pinGroup.classList.remove("hidden");
    }
  });

  forgotBtn.addEventListener("click", () => {
    authMode = "forgot";
    authTitle.innerText = "Reset PIN";
    authSubmitBtn.innerText = "Send Reset Link";
    pinGroup.classList.add("hidden");
    forgotBtn.classList.add("hidden");
    toggleText.innerText = "Remembered your credentials?";
    toggleLink.innerText = "Sign In";
  });

  // Auth Submission Handler
  authSubmitBtn.addEventListener("click", async () => {
    const email = authEmail.value.trim();
    const pin = authPin.value.trim();

    if (!email) return alert("Please enter your email.");

    try {
      if (authMode === "signup") {
        if (pin.length !== 6 || isNaN(pin)) return alert("PIN must be exactly 6 numeric digits.");
        await createUserWithEmailAndPassword(auth, email, pin);
      } else if (authMode === "login") {
        if (pin.length !== 6) return alert("PIN must be exactly 6 numeric digits.");
        await signInWithEmailAndPassword(auth, email, pin);
      } else if (authMode === "forgot") {
        await sendPasswordResetEmail(auth, email);
        alert("PIN reset instructions sent to your email.");
        authMode = "login";
        authTitle.innerText = "Sign In";
        authSubmitBtn.innerText = "Sign In";
        pinGroup.classList.remove("hidden");
        forgotBtn.classList.remove("hidden");
      }
    } catch (err) {
      alert(err.message);
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  // Date and Filter Listeners
  dateInput.addEventListener("change", loadTasks);

  document.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      loadTasks();
    });
  });

  // Add New Task
  addTaskBtn.addEventListener("click", async () => {
    const text = taskInput.value.trim();
    const date = dateInput.value;
    if (!text || !date || !currentUser) return;

    try {
      await addDoc(collection(db, `users/${currentUser.uid}/tasks`), {
        title: text,
        date: date,
        status: "pending",
        createdAt: Date.now()
      });
      taskInput.value = "";
    } catch (err) {
      alert("Error adding task: " + err.message);
    }
  });

  // Load and Render Tasks in Real Time
  function loadTasks() {
    if (!currentUser) return;
    if (unsubscribeTasks) unsubscribeTasks();

    const selectedDate = dateInput.value;
    const taskCol = collection(db, `users/${currentUser.uid}/tasks`);
    const q = query(taskCol, where("date", "==", selectedDate));

    unsubscribeTasks = onSnapshot(q, (snapshot) => {
      taskList.innerHTML = "";
      let tasks = [];
      snapshot.forEach(docSnap => tasks.push({ id: docSnap.id, ...docSnap.data() }));

      if (currentFilter !== "all") {
        tasks = tasks.filter(t => t.status === currentFilter);
      }

      if (tasks.length === 0) {
        taskList.innerHTML = `<p class="muted" style="text-align: center; padding: 16px;">No tasks found for this filter/date.</p>`;
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task-item";

        const badgeClass = task.status === "completed" ? "badge-completed" : (task.status === "in_progress" ? "badge-progress" : "badge-pending");
        const statusLabel = task.status === "completed" ? "Done" : (task.status === "in_progress" ? "In Progress" : "Pending");

        item.innerHTML = `
          <div class="task-left">
            <span class="badge ${badgeClass}">${statusLabel}</span>
            <span class="task-title ${task.status === 'completed' ? 'completed' : ''}">${task.title}</span>
          </div>
          <div class="actions">
            <select class="status-select" data-id="${task.id}" style="width: auto; padding: 4px 8px; font-size: 0.8rem;">
              <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
              <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Completed</option>
            </select>
            <button class="btn-danger del-btn" data-id="${task.id}">✕</button>
          </div>
        `;
        taskList.appendChild(item);
      });

      // Status change handler
      document.querySelectorAll(".status-select").forEach(sel => {
        sel.addEventListener("change", async (e) => {
          const taskId = e.target.dataset.id;
          const newStatus = e.target.value;
          await updateDoc(doc(db, `users/${currentUser.uid}/tasks`, taskId), { status: newStatus });
        });
      });

      // Delete task handler
      document.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const taskId = e.target.dataset.id;
          await deleteDoc(doc(db, `users/${currentUser.uid}/tasks`, taskId));
        });
      });
    });
  }
</script>
</body>
</html>
